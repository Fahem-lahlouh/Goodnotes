name: Déploiement GitHub Pages

# Publie l'interface statique (aucune donnée personnelle : les notes restent dans le navigateur).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-secrets.mjs
      - name: Retire les sourcemaps du site publié
        run: find dist -name '*.map' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Vérifie la version réellement servie (et non une copie en cache du CDN) : version.json doit
  # annoncer le commit déployé, et le service worker doit être servi.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Version servie
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            served=$(curl -fsS "${URL}version.json?nocache=$(date +%s)" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "essai $i : servi=${served:-?} attendu=$expected"
            if [ "$served" = "$expected" ]; then
              curl -fsS -o /dev/null "${URL}sw.js" && curl -fsS -o /dev/null "${URL}manifest.webmanifest"
              echo "Version $expected servie sur $URL"
              exit 0
            fi
            sleep 10
          done
          echo "La version servie ne correspond pas au commit déployé" >&2
          exit 1
