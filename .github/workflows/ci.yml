name: Vérifications

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build
      - name: Contrôle des secrets
        run: node scripts/check-secrets.mjs

  # Tests de bout en bout dans l'image officielle Playwright : navigateurs et dépendances système
  # déjà installés (aucun appel aux miroirs apt, dont l'indisponibilité bloquait la CI).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Chromium (bureau + iPad émulé)
        run: npx playwright test --trace off
      # WebKit (moteur de Safari), iPad Pro 11 émulé. Les tests pilotant le stylet via le
      # protocole Chromium (@cdp) en sont exclus.
      - name: WebKit iPad
        run: npx playwright test --trace off --project webkit-ipad
        env:
          WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
